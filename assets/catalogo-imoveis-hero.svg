<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1916 821" role="img" aria-label="Cidade ao entardecer e residência moderna">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#032f63"/>
    <stop offset=".58" stop-color="#124f86"/>
    <stop offset=".78" stop-color="#d1724e"/>
    <stop offset="1" stop-color="#f2a55b"/>
  </linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#123f67"/>
    <stop offset=".58" stop-color="#0b3157"/>
    <stop offset="1" stop-color="#071e38"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#102e49" stop-opacity=".95"/>
    <stop offset=".52" stop-color="#285271" stop-opacity=".78"/>
    <stop offset="1" stop-color="#101d2d" stop-opacity=".92"/>
  </linearGradient>
  <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffd78d"/>
    <stop offset="1" stop-color="#d98935"/>
  </linearGradient>
  <radialGradient id="sun" cx="0" cy="0" r="1" gradientTransform="translate(175 535) rotate(4) scale(480 210)">
    <stop offset="0" stop-color="#ffd083" stop-opacity=".8"/>
    <stop offset=".42" stop-color="#f1a05f" stop-opacity=".28"/>
    <stop offset="1" stop-color="#f1a05f" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="2.2"/></filter>
</defs>

<rect width="1916" height="821" fill="url(#sky)"/>
<ellipse cx="210" cy="535" rx="520" ry="215" fill="url(#sun)"/>

