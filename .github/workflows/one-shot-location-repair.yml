name: Ajuste final de localização

on:
  push:
    paths:
      - '.github/workflows/one-shot-location-repair.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Adicionar reparo automático ao painel do assessor
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assessor.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script type="module" src="js/assessor.js?v=202609281715"></script>'
          addition = marker + '\n<script type="module" src="js/assessor-location-repair.js?v=202609281625"></script>'
          if 'js/assessor-location-repair.js' not in s:
              if marker not in s:
                  raise SystemExit('Marcador do assessor.js não encontrado')
              s = s.replace(marker, addition, 1)
              p.write_text(s, encoding='utf-8')
          PY
          rm .github/workflows/one-shot-location-repair.yml
      - name: Publicar ajuste
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assessor.html .github/workflows/one-shot-location-repair.yml
          git commit -m "Ativa reparo automático de localização no painel"
          git push origin main
