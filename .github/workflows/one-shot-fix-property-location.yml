name: Corrigir localização dos imóveis

on:
  push:
    paths:
      - '.github/workflows/one-shot-fix-property-location.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Corrigir salvamento da localização
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('js/assessor.js')
          s = p.read_text(encoding='utf-8')
          old_line = '  const googleMapsUrl=existing?.google_maps_url || String(fd.get("google_maps_url")||"").trim()||null;'
          new_line = '  const enteredMapsUrl=String(fd.get("google_maps_url")||"").trim();\n  const googleMapsUrl=enteredMapsUrl || existing?.google_maps_url || null;'
          if old_line not in s:
              raise SystemExit('Linha de googleMapsUrl não encontrada')
          s = s.replace(old_line, new_line, 1)
          old_if = '  if(googleMapsUrl && !existing){'
          new_if = '  const mapsUrlChanged=!!existing && String(existing.google_maps_url||"").trim()!==String(googleMapsUrl||"").trim();\n  const needsLocationResolve=!!googleMapsUrl && (!existing || mapsUrlChanged || latitude==null || longitude==null);\n\n  if(needsLocationResolve){'
          if old_if not in s:
              raise SystemExit('Condição antiga de localização não encontrada')
          s = s.replace(old_if, new_if, 1)
          old_timeout = '      12000,\n      "Leitura do Google Maps"'
          s = s.replace(old_timeout, '      15000,\n      "Leitura do Google Maps"', 1)
          old_coords = '    if(resolved.data?.latitude!=null && resolved.data?.longitude!=null){\n      latitude=Number(resolved.data.latitude);\n      longitude=Number(resolved.data.longitude);\n    }'
          new_coords = '    if(resolved.data?.latitude==null || resolved.data?.longitude==null){\n      msg.textContent="Não foi possível identificar as coordenadas desse link do Google Maps. Gere um novo link em Compartilhar → Copiar link e tente novamente.";\n      return false;\n    }\n    latitude=Number(resolved.data.latitude);\n    longitude=Number(resolved.data.longitude);'
          if old_coords not in s:
              raise SystemExit('Bloco antigo de coordenadas não encontrado')
          s = s.replace(old_coords, new_coords, 1)
          p.write_text(s, encoding='utf-8')
          h = Path('assessor.html')
          hs = h.read_text(encoding='utf-8')
          hs = hs.replace('js/assessor.js?v=202609281715', 'js/assessor.js?v=202609282020')
          hs = hs.replace('js/assessor-location-repair.js?v=202609281625', 'js/assessor-location-repair.js?v=202609282020')
          h.write_text(hs, encoding='utf-8')
          PY
          rm .github/workflows/one-shot-fix-property-location.yml

      - name: Publicar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/assessor.js assessor.html .github/workflows/one-shot-fix-property-location.yml
          git commit -m "Corrige recálculo de coordenadas dos imóveis"
          git push origin main
