name: Corrigir localização dos imóveis

on:
  push:
    paths:
      - '.github/workflows/one-shot-fix-property-location.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Corrigir salvamento da localização
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('js/assessor.js')
          s = p.read_text(encoding='utf-8')

          old = '''  const googleMapsUrl=existing?.google_maps_url || String(fd.get("google_maps_url")||"").trim()||null;
  let latitude=existing?.latitude??null;
  let longitude=existing?.longitude??null;

  if(googleMapsUrl && !existing){
    msg.textContent="1/4 • Validando localização...";
    const resolved=await withTimeout(
      db.functions.invoke("resolve-maps-link",{body:{url:googleMapsUrl}}),
      12000,
      "Leitura do Google Maps"
    );
    if(resolved.error || resolved.data?.error){
      msg.textContent=resolved.data?.error || resolved.error?.message || "Não foi possível ler o link do Google Maps.";
      return false;
    }
    if(resolved.data?.latitude!=null && resolved.data?.longitude!=null){
      latitude=Number(resolved.data.latitude);
      longitude=Number(resolved.data.longitude);
    }
  }
'''

          new = '''  const enteredMapsUrl=String(fd.get("google_maps_url")||"").trim();
  const googleMapsUrl=enteredMapsUrl || existing?.google_maps_url || null;
  let latitude=existing?.latitude??null;
  let longitude=existing?.longitude??null;
  const mapsUrlChanged=!!existing && String(existing.google_maps_url||"").trim()!==String(googleMapsUrl||"").trim();
  const needsLocationResolve=!!googleMapsUrl && (!existing || mapsUrlChanged || latitude==null || longitude==null);

  if(needsLocationResolve){
    msg.textContent="1/4 • Validando localização...";
    const resolved=await withTimeout(
      db.functions.invoke("resolve-maps-link",{body:{url:googleMapsUrl}}),
      15000,
      "Leitura do Google Maps"
    );
    if(resolved.error || resolved.data?.error){
      msg.textContent=resolved.data?.error || resolved.error?.message || "Não foi possível ler o link do Google Maps.";
      return false;
    }
    if(resolved.data?.latitude==null || resolved.data?.longitude==null){
      msg.textContent="Não foi possível identificar as coordenadas desse link do Google Maps. Gere um novo link em Compartilhar → Copiar link e tente novamente.";
      return false;
    }
    latitude=Number(resolved.data.latitude);
    longitude=Number(resolved.data.longitude);
  }
'''

          if old not in s:
              raise SystemExit('Trecho antigo de localização não encontrado em assessor.js')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          h = Path('assessor.html')
          hs = h.read_text(encoding='utf-8')
          hs = hs.replace('js/assessor.js?v=202609281715', 'js/assessor.js?v=202609282015')
          hs = hs.replace('js/assessor-location-repair.js?v=202609281625', 'js/assessor-location-repair.js?v=202609282015')
          h.write_text(hs, encoding='utf-8')
          PY

          rm .github/workflows/one-shot-fix-property-location.yml

      - name: Publicar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/assessor.js assessor.html .github/workflows/one-shot-fix-property-location.yml
          git commit -m "Corrige recálculo de coordenadas dos imóveis"
          git push origin main
